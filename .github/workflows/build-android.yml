name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    # 1. Configurar Java 17 (Requerido por Gradle 9 y AGP 9)
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    # 2. Dar permisos de ejecución a Gradle Wrapper
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    # 3. Solucionar el problema del debug.keystore faltante generando uno temporal
    - name: Generate debug keystore
      run: keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

    # 4. Compilar el APK en modo Debug
    - name: Build Debug APK with Gradle
      run: ./gradlew assembleDebug

    # 5. Subir el APK generado para que puedas descargarlo desde GitHub
    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-apk
        path: app/build/outputs/apk/debug/app-debug.apk
        
