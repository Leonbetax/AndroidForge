name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Locate project and build APK
      run: |
        echo "Buscando dónde está el proyecto Android..."
        # Buscar la ruta exacta del archivo settings.gradle o settings.gradle.kts
        PROJECT_PATH=$(find . -name "settings.gradle*" -not -path "*/.*" | head -n 1)
        
        if [ -z "$PROJECT_PATH" ]; then
          echo "¡Error crítico! No se encontró ningún archivo settings.gradle en el repositorio."
          exit 1
        fi
        
        # Obtener solo el directorio de la ruta encontrada
        PROJECT_DIR=$(dirname "$PROJECT_PATH")
        echo "¡Proyecto encontrado en la carpeta: $PROJECT_DIR"
        
        # Entrar a esa carpeta
        cd "$PROJECT_DIR"
        
        # Generar keystore y compilar
        keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
        gradle :app:assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-apk
        path: '**/build/outputs/apk/debug/app-debug.apk'
        
