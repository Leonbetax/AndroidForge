name: Build Android APK from ZIP

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Extract ZIP and Build APK
      run: |
        echo "Buscando el archivo ZIP en la carpeta input..."
        ls -la input/
        
        # Crear una carpeta de trabajo y descomprimir el zip del usuario
        mkdir -p working_project
        unzip -q input/stickman-flow.zip -d working_project/
        
        # Entrar a la carpeta descomprimida
        cd working_project/
        
        # Si el zip contiene una carpeta contenedora, entramos en ella si es necesario
        # Verificamos dónde quedó el settings.gradle o build.gradle.kts
        PROJECT_DIR=$(find . -name "settings.gradle*" -not -path "*/.*" | head -n 1 | xargs dirname)
        if [ ! -z "$PROJECT_DIR" ] && [ "$PROJECT_DIR" != "." ]; then
          cd "$PROJECT_DIR"
        fi
        
        echo "Directorio de compilación final:"
        pwd
        
        # Generar keystore y compilar
        keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
        
        # Verificar si existe gradlew o usar gradle directamente
        if [ -f "./gradlew" ]; then
          chmod +x gradlew
          ./gradlew :app:assembleDebug
        else
          gradle :app:assembleDebug
        fi

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-apk
        path: '**/build/outputs/apk/debug/app-debug.apk'
        
